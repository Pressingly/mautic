<VirtualHost *:80>
    DocumentRoot /var/www/html
    ServerSignature Off

    # The repo's .htaccess files are the access rules (front controller, deny *.php, .env*,
    # media/files/), so they must be honoured.
    <Directory /var/www/html>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
