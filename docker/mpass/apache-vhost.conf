<VirtualHost *:80>
    # scheme://host from MAUTIC_SITE_URL (exported by the entrypoint). TLS ends at Traefik, so
    # without this Apache builds its own redirects (the .htaccess /index.php/<path> 301) as http://.
    # No `SetEnvIf X-Forwarded-Proto https HTTPS=on`: that would believe any caller on the network;
    # Symfony's TrustMiddleware already honours X-Forwarded-Proto from TRUSTED_PROXIES only.
    ServerName ${MAUTIC_SERVER_NAME}
    UseCanonicalName On

    DocumentRoot /var/www/html
    ServerSignature Off

    # The repo's .htaccess files are the access rules (front controller, deny *.php, .env*,
    # media/files/), so they must be honoured.
    <Directory /var/www/html>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
